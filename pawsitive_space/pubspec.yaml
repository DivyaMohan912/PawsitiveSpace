name: pawsitive_space
description: A non-profit, volunteer-driven mobile app for animal welfare, rescue, fostering, adoption, and community support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9

  # Backend & Authentication
  supabase_flutter: ^2.0.3

  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_slidable: ^3.0.1

  # Media
  image_picker: ^1.0.5
  file_picker: ^6.1.1

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Networking
  http: ^1.1.2
  connectivity_plus: ^5.0.2

  # Utils
  intl: any
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  permission_handler: ^11.1.0
  equatable: ^2.0.5
  uuid: ^4.2.2
  timeago: ^3.6.0

  # Forms & Validation
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
