<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { zoom: 0.57; }
  html, body { width: 1080px; height: 1080px; }
  body {
    font-family: 'Nunito', sans-serif;
    background: radial-gradient(circle at 50% 38%, #FFB347 0%, #FF9A4F 45%, #FF8C42 78%, #F5762A 100%);
    display: grid; place-items: center; position: relative; overflow: hidden;
  }
  /* Safe circle guide is invisible; content kept within center 78% for circular crop */
  .ring { position: absolute; width: 1080px; height: 1080px; border-radius: 50%; box-shadow: inset 0 0 0 26px rgba(255,255,255,0.14); }
  .paw-bg { position: absolute; color: #fff; opacity: 0.10; }
  .b1 { top: 120px; left: 90px; transform: rotate(-18deg); }
  .b2 { bottom: 110px; right: 90px; transform: rotate(22deg); }

  .stack { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; margin-top: -20px; }
  .disc {
    width: 430px; height: 430px; border-radius: 50%; background: #fff;
    display: grid; place-items: center; box-shadow: 0 26px 60px rgba(160,70,10,0.35);
  }
  .disc svg { width: 300px; height: 300px; color: #FF8C42; }
  .title { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 92px; color: #fff; margin-top: 54px; letter-spacing: 0.5px; text-shadow: 0 4px 14px rgba(150,60,10,0.3); }
  .tag { font-weight: 800; font-size: 34px; color: #FFF3E2; margin-top: 10px; letter-spacing: 3px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="ring"></div>
  <svg class="paw-bg b1" width="230" height="230" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18c-2.2 0-4-1.3-4-3s1.8-3 4-3 4 1.3 4 3-1.8 3-4 3zm-5.5-5.5a2 2 0 100-4 2 2 0 000 4zm3-3.5a2 2 0 100-4 2 2 0 000 4zm5 0a2 2 0 100-4 2 2 0 000 4zm3 3.5a2 2 0 100-4 2 2 0 000 4z"/></svg>
  <svg class="paw-bg b2" width="260" height="260" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18c-2.2 0-4-1.3-4-3s1.8-3 4-3 4 1.3 4 3-1.8 3-4 3zm-5.5-5.5a2 2 0 100-4 2 2 0 000 4zm3-3.5a2 2 0 100-4 2 2 0 000 4zm5 0a2 2 0 100-4 2 2 0 000 4zm3 3.5a2 2 0 100-4 2 2 0 000 4z"/></svg>

  <div class="stack">
    <div class="disc">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 18c-2.2 0-4-1.3-4-3s1.8-3 4-3 4 1.3 4 3-1.8 3-4 3zm-5.5-5.5a2 2 0 100-4 2 2 0 000 4zm3-3.5a2 2 0 100-4 2 2 0 000 4zm5 0a2 2 0 100-4 2 2 0 000 4zm3 3.5a2 2 0 100-4 2 2 0 000 4z"/></svg>
    </div>
    <div class="title">PawsitiveSpace</div>
    <div class="tag">Hyderabad&nbsp;·&nbsp;Rescue&nbsp;·&nbsp;Adopt</div>
  </div>
</body>
</html>
